
<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SolvePilot AI</title>
  <style>
    body {
      margin: 0;
      background: #080e1e;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    header { padding: 65px 20px 30px; }
    h1 { color: #d9b75f; font-size: 42px; }
    p { color: #c5cee0; }
    main { max-width: 650px; margin: auto; padding: 20px; }
    textarea {
      box-sizing: border-box;
      width: 100%;
      height: 150px;
      padding: 16px;
      border-radius: 12px;
      font-size: 16px;
    }
    button {
      background: #2478ed;
      color: white;
      border: 0;
      border-radius: 10px;
      padding: 15px 30px;
      margin-top: 18px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <header>
    <h1>👑 SolvePilot AI</h1>
    <p>Your Intelligent Solution</p>
  </header>
  <main>
    <h2>Cu ce te putem ajuta astăzi?</h2>
    <textarea placeholder="Scrie întrebarea ta aici..."></textarea>
    <button type="button">Găsește soluția</button>
    <p>O întrebare gratuită pe zi.</p>
  </main>
</body>
</html>
